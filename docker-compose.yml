name: legacy-php533-lab

services:
  web:
    platform: linux/amd64
    build: .
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-crm_demo}
      DB_USER: ${DB_USER:-crm_demo}
      DB_PASSWORD: ${DB_PASSWORD:-local_demo_password}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - frontend
      - lab

  db:
    image: mariadb:5.5.64
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
      MYSQL_DATABASE: ${DB_NAME:-crm_demo}
      MYSQL_USER: ${DB_USER:-crm_demo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_demo_password}
    volumes:
      - demo-data:/var/lib/mysql
      - ./database/001-demo.sql:/docker-entrypoint-initdb.d/001-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT COUNT(*) FROM clients' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - lab

volumes:
  demo-data:

networks:
  frontend:
  lab:
    internal: true

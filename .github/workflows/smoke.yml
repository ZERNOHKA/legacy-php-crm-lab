name: Legacy environment smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration and build from source
        run: |
          docker compose config --quiet
          docker compose build
      - name: Start the demo
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify CLI runtime and PHP syntax
        run: |
          docker compose exec -T web php /opt/lab/check-runtime.php
          docker compose exec -T web sh -c 'find /var/www/html /opt/lab -name "*.php" | while IFS= read -r file; do php -l "$file" || exit 1; done'
      - name: Verify HTTP, CGI, database, sessions and filters
        run: python3 scripts/smoke.py
      - name: Install browser checks
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/playwright install --with-deps chromium
      - name: Verify desktop and mobile in Chromium
        run: .venv/bin/python scripts/ui-smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: artifacts/ui/
          if-no-files-found: ignore
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 100
      - name: Stop the disposable CI environment
        if: always()
        run: docker compose down -v
